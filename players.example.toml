# Custom Media Player Configuration
# Copy this to ~/.config/fwrd/players.toml to override built-in player definitions
#
# You can add new players or override existing ones
# Built-ins load first, then ~/.config/fwrd/players.toml, then ./players.toml.
# A matching name replaces the WHOLE definition, not individual media types.
# Add the player name to the relevant [media.<platform>] preference list in
# config.toml to select it. Only HTTP(S) targets are accepted.
# Arguments are passed directly, without shell expansion, and the URL is
# appended last. Use an absolute output path, not ~ or $HOME.

# Example: Add a custom video player
[players.celluloid]
description = "Celluloid (formerly GNOME MPV)"
platforms = ["linux"]

[players.celluloid.video]
args = ["--new-window"]

# Example: Override iina settings
[players.iina]
description = "IINA with custom settings"
platforms = ["darwin"]

[players.iina.video]
args = ["--no-stdin", "--pip"]  # Add picture-in-picture mode

# Keep audio support when replacing the built-in iina definition.
[players.iina.audio]
args = ["--no-stdin"]

# Example: Add yt-dlp as a "player" for downloading
[players.yt-dlp]
description = "Download videos with yt-dlp"
platforms = ["darwin", "linux", "windows"]

[players.yt-dlp.video]
# Replace this with an absolute path appropriate to your OS.
args = ["-P", "/absolute/path/to/Downloads", "-o", "%(title)s.%(ext)s"]

# Example: Use streamlink for streaming
[players.streamlink]
description = "Stream with streamlink + mpv"
platforms = ["darwin", "linux", "windows"]

[players.streamlink.video]
# --default-stream leaves the URL as the sole positional argument.
args = ["--player", "mpv", "--default-stream", "best"]
